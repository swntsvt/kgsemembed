[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kgsemembed"
version = "0.1.0"
description = "Phase 2 KG matching: dense retrieval and verbalisation study"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Savita Kiran Sawant" }]
dependencies = [
  "sentence-transformers",
  "transformers",
  "torch",
  "pandas",
  "numpy",
  "scipy",
  "rdflib==7.6.0",
  "hydra-core",
  "omegaconf",
  "tqdm",
  "matplotlib",
  "seaborn",
  "orjson",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
